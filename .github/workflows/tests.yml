name: Backend checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test API
        run: PYTHONPATH=. pytest -q tests/
      - name: Verify browser syntax
        run: node --check web/app.js
      - name: Build the production Docker image
        run: docker build -t watchbeat:ci .
      - name: Verify Python imports as non-root runtime user
        run: docker run --rm --entrypoint python watchbeat:ci -c "import os, uvicorn, fastapi, sqlalchemy, psycopg; assert os.geteuid() == 10001; print('Non-root Python runtime OK')"
